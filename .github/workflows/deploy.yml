name: Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Set environment variable
        run: | 
          # echo "TZ='Europe/Warsaw'" >> $GITHUB_ENV
          echo "BUILD_TIME=$(date +'%T')" >> $GITHUB_ENV
          echo "VITE_BUILD_DT=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV
          echo "VITE_BUILD_ID=${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:7}" >> $GITHUB_ENV


      - name: Use environment variable
        run: |
          echo "Deploying at $BUILD_TIME"
          echo "The value of VITE_BUILD_DT is $VITE_BUILD_DT"
          echo "The value of VITE_BUILD_ID is $VITE_BUILD_ID"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
                  
      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

      - name: Sprawdzam 
        run: |
          ls ./dist 
          cat ./dist/index.html          

  deploy:    
    # Add a dependency to the build job
    needs: build

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source    
    
    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Specify runner + deployment step
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
        
      - name: Powiadomienie o sukcesie (ntfy)
        # Warunek: uruchom ten krok tylko jeśli poprzednie zakończyły się sukcesem
        if: success()
        env:
          NTFY_URL: "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}"
        run: |
          curl -s \
            -H "Title: ✅ Deployment Udany!" \
            -H "Priority: high" \
            -H "Tags: rocket" \
            -H "Actions: view, Otwórz GitHub, https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "Deployment repozytorium ${{ github.repository }} na gałąź ${{ github.ref_name }} zakończył się sukcesem." \
            $NTFY_URL

      - name: Powiadomienie o błędzie (ntfy)
        # Warunek: uruchom ten krok tylko jeśli któryś z poprzednich kroków zawiódł
        if: failure()
        env:
          NTFY_URL: "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}"
        run: |
          curl -s \
            -H "Title: ❌ Deployment Zawiódł!" \
            -H "Priority: urgent" \
            -H "Tags: warning" \
            -H "Actions: view, Sprawdź logi, https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "Deployment repozytorium ${{ github.repository }} na gałąź ${{ github.ref_name }} zakończył się błędem." \
            $NTFY_URL
