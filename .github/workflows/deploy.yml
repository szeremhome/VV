name: Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    env:
      APP_URL: steps.deployment.outputs.page_url
      VITE_BUILD_DT: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
      VITE_BUILD_ID: ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:7}


    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sprawdzenie zmiennych
        run: |
          echo "APP_URL: $APP_URL"
          echo "VITE_BUILD_DT: $VITE_BUILD_DT"
          echo "VITE_BUILD_ID: $VITE_BUILD_ID"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

                  
      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Sprawdzam
        run: |
          pwd; ls -lah;

