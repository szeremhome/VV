name: V Scheduled setup and notify

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Tryb pracy
        type: choice
        options: [heating, standby]
        default: standby
      temperature:
        description: Temperatura CO
        type: string
        default: "21"
      
  schedule:
    - cron: "01 06 * * 1-5"    # pon-pt rano grzanie on 
    - cron: "01 07 * * 1-5"    # pon-pt rano grzanie off    
    - cron: "30 17 * * 1-5"    # pon-pt rano grzanie on 
    - cron: "01 19 * * 1-5"    # pon-pt rano grzanie off

jobs:
  send-scheduled-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Wyślij powiadomienie przez ntfy
        env:
          BASE: "https://api.viessmann-climatesolutions.com/iot/v2/features/installations/${{ secrets.V_INSTALLATION_ID }}/gateways/${{ secrets.V_GATEWAY_SERIAL }}/devices/0/features"
          ACCESS_TOKEN: "${{ secrets.V_ACCESS_TOKEN}}"
          NTFY_URL: "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}"
          SCHEDULE: ${{ github.event.schedule }}
          # INPUT_MODE: ${{ inputs.mode }}
          # INPUT_TEMP: ${{ inputs.temperature }}          
        run: |
          # set -euo pipefail

          # case "$SCHEDULE" in
          #   "0 4 * * 1-5")  MODE=heating; TEMPERATURE=21 ;;
          #   "0 5 * * 1-5")  MODE=heating; TEMPERATURE=18 ;;
          #   "0 20 * * 1-5") MODE=standby; TEMPERATURE=0 ;;
          #   "0 6 * * 0,6")  MODE=heating; TEMPERATURE=20 ;;
          #   *)              MODE="${INPUT_MODE:-heating}"; TEMPERATURE="${INPUT_TEMP:-21}" ;;
          # esac
          echo "Tryb: $BASE, temperatura: $SCHEDULE"

          # # 1. Aktywacja CO
          # curl -fsS -X POST "$BASE/heating.circuits.0.operating.modes.active/commands/setMode" \
          #   -H "Authorization: Bearer $ACCESS_TOKEN" \
          #   -H "Content-Type: application/json" \
          #   -d '{"mode": "heating"}'

          # # 2. Ustawienie temperatury
          # curl -fsS -X POST "$BASE//heating.circuits.0.operating.programs.normal/commands/setTemperature" \
          #   -H "Authorization: Bearer $ACCESS_TOKEN" \
          #   -H "Content-Type: application/json" \
          #   -d '{"targetTemperature": "33"}'

          # 3. Wysłanie powiadomienia
          curl -s \
            -H "Title: Aktywacja CO" \
            -H "Priority: default" \
            -H "Tags: calendar" \
            -d "Aktywacja CO i ustawienie temperatury 35." \
            $NTFY_URL
